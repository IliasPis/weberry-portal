services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: weberry-portal-app:latest
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: postgres
        volumes:
            - storage_data:/var/www/html/storage/app
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - weberry

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - storage_data:/var/www/html/storage/app:ro
        depends_on:
            - app
        networks:
            - weberry

    queue:
        image: weberry-portal-app:latest
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: postgres
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - storage_data:/var/www/html/storage/app
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - weberry

    scheduler:
        image: weberry-portal-app:latest
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: postgres
        entrypoint: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        volumes:
            - storage_data:/var/www/html/storage/app
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - weberry

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-weberry_portal}
            POSTGRES_USER: ${DB_USERNAME:-weberry_app}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-weberry_app}']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - weberry

volumes:
    postgres_data:
    storage_data:

networks:
    weberry:
        driver: bridge
